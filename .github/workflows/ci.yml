# Minimal CI (SPEC §15). The single job is named `ci`: branch protection requires that check.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the commit range

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Python env (base deps + dev group; no ML/GPU extras)
        run: |
          uv python install 3.11
          uv sync --locked

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pytest
        run: uv run pytest

      - name: tizita validate
        run: uv run tizita validate
      # `tizita plan --check` is added once committed outputs exist (M2+); on an empty
      # cache it exits 1 by design.

      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
