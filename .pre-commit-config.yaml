repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=6144"]
        exclude: ^(docs/challenge/|outputs/music/)  # music candidates: ~8 MB FLAC on purpose
      - id: end-of-file-fixer
        exclude: (\.(jsonl|pdf|ttf)$|^assets/fonts/)
      - id: trailing-whitespace
        exclude: (\.(jsonl|pdf|ttf|md)$|^assets/fonts/)
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
