# Assembly settings (SPEC §10). Every value here is hashed into the stages that read it.
timing:
  lead_s: 0.4            # silence before each narration take inside its slot
  tail_s: 0.6            # silence after it
  crossfade_s: 0.4       # slot overlap for crossfade / fade_black transitions
  fps: 24
subtitles:
  max_chars_per_line: 40
  max_lines: 2
  min_cue_s: 0.8
  font: Noto Sans
  fonts_dir: assets/fonts
  # 9:16 clears platform UI (~22% bottom margin); 16:9 sits near the bottom (~8%).
  styles:
    "9x16": { play_res: [1080, 1920], font_size: 58, margin_v_pct: 22, margin_h: 80, outline: 3, shadow: 1 }
    "16x9": { play_res: [1920, 1080], font_size: 46, margin_v_pct: 8, margin_h: 160, outline: 3, shadow: 1 }
audio:
  working_lufs: -16      # per-source pre-normalisation before the mix
  duck: { threshold: 0.02, ratio: 6, attack_ms: 300, release_ms: 1500 }
  pad_gain_db: -10       # synth pad level before ducking
  final: { lufs: -14, tp: -1, lra: 11, aac_kbps: 192, rate: 48000 }
video:
  preset: veryfast
  crf: 18
pad:
  # D minor ambient pad (SPEC §5.1 music.key): D3 F3 A3 D4, slow tremolo, low-pass, long fades.
  freqs: [146.83, 174.61, 220.0, 293.66]
  tremolo_hz: 0.18
  lowpass_hz: 900
  fade_in_s: 2
  fade_out_s: 3
# ---- M4/M5 film assembly (new top-level keys so the radio cut's cache key is unchanged)
kenburns:
  # i2v shots whose Wan clip is missing degrade to this when their own kenburns block is flat
  fallback: { zoom_from: 1.0, zoom_to: 1.07, pan: none }
  still: { zoom_from: 1.0, zoom_to: 1.03, pan: none }
  min_i2v_speed: 0.85    # an i2v clip may be slowed to 0.85x, then its last frame is held
look:
  contrast: 1.03
  saturation: 0.97
  grain: 3               # noise=alls=N:allf=t. 6 made the 9:16 film 295 MB (CRF 18); 3 ~4.6 MB per 7 s; 2 is erased by x264 (26 Nov)
  fade_out_s: 0.6        # fade to black before the end card
  card_fade_s: 0.5
  blur_sigma: 30         # 16:9 background fill
  bg_brightness: -0.12
music_mix:
  gain_db: -8            # music level after pre-normalisation, before ducking
  fade_in_s: 2
  fade_out_s: 3
pad_variants:            # synth_pad candidates for `tizita choose music N` (storyboard key: G major)
  - { name: "G major (G3 B3 D4 G4)", freqs: [196.0, 246.94, 293.66, 392.0] }
  - { name: "E minor (E3 G3 B3 E4)", freqs: [164.81, 196.0, 246.94, 329.63] }
  - { name: "Cmaj7 (C3 E3 G3 B3)", freqs: [130.81, 164.81, 196.0, 246.94] }
qa:
  duration_s: [60, 90]
  lufs: -14
  lufs_tol: 1
  max_tp: -1
  sizes: { "9x16": [1080, 1920], "16x9": [1920, 1080] }
master:
  tp: -2.0               # loudnorm TP target before AAC (QA max -1). The encoder runs with -aac_pns 0: PNS added +2 dB peaks on our speech at 192k (measured 26 Nov)
