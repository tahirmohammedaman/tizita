# Pipeline thresholds and plan estimates (SPEC §5.2, §6.3). Tune from real runs; see COSTS.md.
shots: { min: 8, max: 12 }
duration_s: { min: 60, max: 90 }          # shots + end card, planned and measured

gpu:
  # Kaggle 2×T4 Wan 2.2 TI2V-5B at 480p: estimate until M4 measures it.
  minutes_per_i2v_shot: 6
  max_i2v_shots: 6                         # SPEC §9: hero shots only; the rest are Ken Burns
  budget_minutes: 60

# Per-unit estimates printed by `tizita plan` (seconds of wall clock, GPU minutes).
